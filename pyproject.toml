[project]
name = "orcs"
version = "0.1.0"
description = "Oracle Robot Control Synthesis — privileged-observation policies for humanoid control"
readme = "readme.md"
# 3.11, not 3.10: `tomllib` (rosters) is stdlib only from 3.11.
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE", "LICENSES/*", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Lokesh Krishna", email = "lkrajan@usc.edu" }]
dependencies = [
    # ── active ─────────────────────────────────────────────────────────────────
    # Validated simulator stack. ORCS imports MuJoCo directly and patches
    # mujoco_warp.put_data, so these versions are part of its runtime contract.
    "mjlab==1.4.0",
    "mujoco==3.8.1",
    "mujoco-warp==3.8.1",
    "warp-lang==1.13.0",
    "joblib",           # reads SONIC smpl .pkl clips (orcs.tasks.uolm.smpl_data)
    # NB: numpy/torch are guaranteed by mjlab; mocke + rsl_rl are git deps owned
    # by deps.lock, never listed here.

    # ── variants (uncomment and adapt) ─────────────────────────────────────────
    # 1.  PyPI, latest compatible          "wandb>=0.17"
    # 2.  PyPI, exact pin                  "numpy==1.26.4"
    # 3.  PyPI, version range              "torch>=2.1.0,<2.4.0"
    # 4.  PyPI, no constraint              "tqdm"
    # 5.  Git, HEAD (not reproducible)     "pkg @ git+https://github.com/org/pkg.git"
    # 6.  Git, commit SHA  ← preferred     "pkg @ git+https://github.com/org/pkg.git@a1b2c3d"
    # 7.  Git, tag                         "pkg @ git+https://github.com/org/pkg.git@v1.4.0"
    # 8.  Git, branch (moving target)      "pkg @ git+https://github.com/org/pkg.git@my-branch"
    # 9.  Local editable sibling repo      "pkg"  +  pip install -e /path/to/pkg  (separately)
    # 10. Embedded vendor copy             "pkg @ file:///${PWD}/vendor/pkg"
    # note: variants 5-10 won't upload to PyPI — fine for research repos
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Non-`.py` files setuptools would otherwise drop from a wheel. Editable installs
# point at the source tree and hide this, so the omission only shows up as a
# `pip install git+...` where every PerLoco task silently skips registration.
[tool.setuptools.package-data]
"orcs.tasks.perloco" = ["rosters/*.toml"]

# mjlab auto-discovers tasks by importing this module at startup.
# Format: <key> = "<python-module-to-import>"  (key is arbitrary, module is what gets imported)
# The package root stays lightweight; registration imports task packages and
# triggers their register_mjlab_task() calls.
# Multi-package: add one line per package that registers tasks.
[project.entry-points."mjlab.tasks"]
orcs = "orcs.registration"

# The data pipeline ships INSIDE the package (`orcs.cli`), so a pip-installed
# orcs can produce the data it consumes. `scripts/*.py` are thin wrappers.
[project.scripts]
orcs-stage-terrain = "orcs.cli.stage_terrain_motions:main"
orcs-view-terrain = "orcs.cli.view_terrain_motions:main"
orcs-build-smpl = "orcs.cli.build_smpl_dataset:main"
orcs-rollout-smpl = "orcs.cli.rollout_smpl:main"
orcs-make-nominal = "orcs.cli.make_nominal_motion:main"
orcs-pseudo-retarget = "orcs.cli.pseudo_retarget:main"
orcs-view-seeds = "orcs.cli.view_seed_motion:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
# Staging-time only — the runtime never imports these, so a training env that
# consumes already-staged data does not need them.
perloco = [
    "usd-core",   # GRAIL tile geometry (`from pxr import Usd`)
    "smplx",      # GRAIL --smpl body-model forward pass
    "viser",      # orcs-view-terrain
]

[tool.ruff]
src = ["src"]
indent-width = 4
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
